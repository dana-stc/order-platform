# kind create cluster --config k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: order-platform
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080     # api-gateway NodePort (see overlays/local)
        hostPort: 8080
      - containerPort: 30030     # Grafana NodePort (see observability/kube-prometheus-stack-values.yaml)
        hostPort: 3000
