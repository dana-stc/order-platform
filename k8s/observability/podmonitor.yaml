apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: order-platform
  namespace: observability
spec:
  namespaceSelector:
    matchNames: [order-platform]
  selector:
    matchExpressions:
      - {key: app.kubernetes.io/part-of, operator: In, values: [order-platform]}
      - {key: app.kubernetes.io/name, operator: In, values: [api-gateway, order-service, inventory-service, payment-service, notification-service]}
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
