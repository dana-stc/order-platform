apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels: {app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: order-platform}
spec:
  selector: {app.kubernetes.io/name: notification-service}
  ports:
    - {name: http, port: 8084, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: {app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: order-platform}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: notification-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: order-platform}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8084"
    spec:
      terminationGracePeriodSeconds: 40
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z kafka 9092; do echo waiting for postgres and kafka; sleep 2; done"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: notification-service
          image: order-platform/notification-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8084}
          env:
            - {name: SERVER_PORT, value: "8084"}
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/notifications
          envFrom:
            - configMapRef: {name: platform-config}
            - secretRef: {name: db-credentials}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sh", "-c", "sleep 5"]}     # let the endpoint be removed before SIGTERM
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 640Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: notification-service}
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
