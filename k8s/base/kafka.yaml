# Single-node KRaft Kafka: fine for local/dev. For production use a managed Kafka (MSK, Confluent Cloud)
# or the Strimzi operator with 3 brokers and replication factor 3 (set platform.kafka.replicas=3).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: order-platform}
spec:
  selector: {app.kubernetes.io/name: kafka}
  ports:
    - {name: client, port: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: order-platform}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: order-platform}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports: [{name: client, containerPort: 9092}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENERS, value: "CONTROLLER://:9093,PLAINTEXT://:9092"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
