# Only order-platform pods may talk to the data stores. (Enforced when the CNI supports NetworkPolicy:
# Calico/Cilium yes; kind's default kindnet does not.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datastores-only-from-platform
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [postgres, kafka]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/part-of: order-platform}
