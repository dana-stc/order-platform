# Local infrastructure.
#   docker compose up -d                      -> postgres, kafka, prometheus, tempo, grafana (run the services from your IDE/mvn)
#   docker compose --profile apps up -d       -> additionally runs the 5 services as containers
#                                                (build the images first:  make images)
name: order-platform

x-app: &app
  profiles: ["apps"]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    DB_USER: app
    DB_PASSWORD: app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0          # single node, KRaft (no ZooKeeper)
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8089:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on: [kafka]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "4318:4318"     # OTLP/HTTP (what Spring Boot exports to)
      - "3200:3200"     # Tempo query API

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo]

  # ---- applications (profile "apps") ------------------------------------------------------------------------
  api-gateway:
    <<: *app
    image: order-platform/api-gateway:local
    ports: ["8080:8080"]
    environment:
      <<: *app-env
      ORDER_SERVICE_URL: http://order-service:8081
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
    depends_on: [order-service]

  order-service:
    <<: *app
    image: order-platform/order-service:local
    ports: ["8081:8081"]
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/orders

  inventory-service:
    <<: *app
    image: order-platform/inventory-service:local
    ports: ["8082:8082"]
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory

  payment-service:
    <<: *app
    image: order-platform/payment-service:local
    ports: ["8083:8083"]
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/payments

  notification-service:
    <<: *app
    image: order-platform/notification-service:local
    ports: ["8084:8084"]
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/notifications

volumes:
  pgdata:
